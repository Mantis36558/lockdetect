name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Generate SHA-512 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA512 -Path 'build\lockdetect.exe').Hash.ToLower()
          "$hash  lockdetect.exe" | Set-Content -Path 'build\SHA512SUMS.txt' -Encoding ascii
          Get-Content 'build\SHA512SUMS.txt'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/lockdetect.exe
            build/SHA512SUMS.txt
          generate_release_notes: true
